name: "Clone Repositories"
description: "Clones repositories listed in a provided project.deps file"

inputs:
  token:
    description: >
      Personal access token (PAT), without a username prefix, used to fetch repositories.
      Authentication is configured only for the cloning step and is not persisted.


      We recommend using a service account with the least permissions necessary.
      Also when generating a new PAT, select the least scopes necessary.


      [Learn more about creating and using encrypted secrets](https://help.github.com/en/actions/automating-your-workflow-with-github-actions/creating-and-using-encrypted-secrets)
    default: ${{ github.token }}
  project_deps_path:
    description: "Path to the project.deps file with repository names"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set github_head_ref and github_base_ref
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "GITHUB_HEAD_REF=${{ github.head_ref }}" >> $GITHUB_ENV
          echo "GITHUB_BASE_REF=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
        else
          echo "GITHUB_HEAD_REF=${{ github.ref }}" >> $GITHUB_ENV
          echo "GITHUB_BASE_REF=${{ github.ref }}" >> $GITHUB_ENV
        fi
      shell: bash
    - name: Clone repositories from project.deps
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PROJECT_DEPS_PATH: ${{ inputs.project_deps_path }}
        HEAD_BRANCH: ${{ env.GITHUB_HEAD_REF }}
        BASE_BRANCH: ${{ env.GITHUB_BASE_REF }}
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.https://github.com.helper
        GIT_CONFIG_VALUE_1: >-
          !f() { if [ "$1" = get ]; then printf '%s\n' 'username=x-access-token' "password=$GH_TOKEN"; fi; }; f
      run: bash "${{ github.action_path }}/clone.sh"
