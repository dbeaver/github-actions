name: "Clone Repositories"
description: "Clones repositories listed in a provided project.deps file"

inputs:
  token:
    description: >
      Personal access token (PAT), without a username prefix, used to fetch repositories.
      Authentication is configured only for the cloning step and is not persisted.


      We recommend using a service account with the least permissions necessary.
      Also when generating a new PAT, select the least scopes necessary.


      [Learn more about creating and using encrypted secrets](https://help.github.com/en/actions/automating-your-workflow-with-github-actions/creating-and-using-encrypted-secrets)
    default: ${{ github.token }}
  project_deps_path:
    description: "Path to the project.deps file with repository names"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set github_head_ref and github_base_ref
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "GITHUB_HEAD_REF=${{ github.head_ref }}" >> $GITHUB_ENV
          echo "GITHUB_BASE_REF=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
        else
          echo "GITHUB_HEAD_REF=${{ github.ref }}" >> $GITHUB_ENV
          echo "GITHUB_BASE_REF=${{ github.ref }}" >> $GITHUB_ENV
        fi
      shell: bash
    - name: Clone repositories from project.deps
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PROJECT_DEPS_PATH: ${{ inputs.project_deps_path }}
        HEAD_BRANCH: ${{ env.GITHUB_HEAD_REF }}
        BASE_BRANCH: ${{ env.GITHUB_BASE_REF }}
        GIT_CONFIG_COUNT: '2'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.https://github.com.helper
        GIT_CONFIG_VALUE_1: >-
          !f() { if [ "$1" = get ]; then printf '%s\n' 'username=x-access-token' "password=$GH_TOKEN"; fi; }; f
      run: |
        set -euo pipefail

        # Walk the dependency graph breadth-first. Clone each level in parallel,
        # then read its project.deps files to discover the next level.
        declare -A visited=()
        queue=()
        max_parallel=8

        enqueue_dependencies() {
          local file=$1 repo
          [[ -f $file ]] || return 0
          while IFS= read -r repo || [[ -n $repo ]]; do
            repo=${repo%$'\r'}
            repo=${repo#"${repo%%[![:space:]]*}"}
            repo=${repo%"${repo##*[![:space:]]}"}
            [[ -z $repo || $repo == \#* ]] && continue
            if [[ ! $repo =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
              echo "Invalid repository name in $file: $repo" >&2
              exit 1
            fi
            queue+=("$repo")
          done < "$file"
        }

        clone_repository() {
          local repo=$1 url default_branch
          echo "Cloning repository: $repo"
          url="https://github.com/dbeaver/$repo.git"
          default_branch=$(git ls-remote --symref "$url" HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2; exit}')
          # Prefer the PR branch, then its base branch, then the remote default.
          git clone --depth 1 -b "${HEAD_BRANCH#refs/heads/}" "$url" 2>/dev/null || \
            git clone --depth 1 -b "${BASE_BRANCH#refs/heads/}" "$url" 2>/dev/null || \
            git clone --depth 1 -b "$default_branch" "$url"
        }

        if [[ ! -f $PROJECT_DEPS_PATH ]]; then
          echo "Dependency file not found: $PROJECT_DEPS_PATH" >&2
          exit 1
        fi
        enqueue_dependencies "$PROJECT_DEPS_PATH"
        level_start=0
        while ((level_start < ${#queue[@]})); do
          level_end=${#queue[@]}
          pending_pids=()
          failed=0
          for ((index=level_start; index<level_end; index++)); do
            repo=${queue[index]}
            [[ -v visited[$repo] ]] && continue
            visited[$repo]=1
            if [[ ! -d $repo ]]; then
              clone_repository "$repo" &
              pending_pids+=("$!")
              if ((${#pending_pids[@]} >= max_parallel)); then
                if ! wait "${pending_pids[0]}"; then failed=1; fi
                pending_pids=("${pending_pids[@]:1}")
              fi
            fi
          done
          for pid in "${pending_pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          if ((failed)); then
            echo "One or more repository clones failed" >&2
            exit 1
          fi
          # Include dependencies of existing checkouts, but never revisit a repo.
          for ((index=level_start; index<level_end; index++)); do
            enqueue_dependencies "${queue[index]}/project.deps"
          done
          level_start=$level_end
        done
