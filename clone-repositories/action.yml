name: "Clone Repositories"
description: "Clones repositories listed in a provided project.deps file"

inputs:
  token:
    description: >
      Personal access token (PAT) used to fetch the repository. The PAT is configured
      with the local git config, which enables your scripts to run authenticated git
      commands. The post-job step removes the PAT.

      We recommend using a service account with the least permissions necessary.
      Also when generating a new PAT, select the least scopes necessary.

      [Learn more about creating and using encrypted secrets](https://help.github.com/en/actions/automating-your-workflow-with-github-actions/creating-and-using-encrypted-secrets)
    default: ${{ github.token }}
  project_deps_path:
    description: "The content of the project.deps file with repository names"
    required: true

outputs:
  cloned-folders:
    description: "List of cloned repository directories"
    value: ${{ steps.clone-repositories.outputs.folders }}

runs:
  using: "composite"
  steps:
    - name: Install git-restore-mtime
      shell: bash
      run: sudo apt install git-restore-mtime

    - name: Set github_head_ref and github_base_ref
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "GITHUB_HEAD_REF=${{ github.head_ref }}" >> $GITHUB_ENV
          echo "GITHUB_BASE_REF=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
        else
          echo "GITHUB_HEAD_REF=${{ github.ref }}" >> $GITHUB_ENV
          echo "GITHUB_BASE_REF=${{ github.ref }}" >> $GITHUB_ENV
        fi

    - name: Clone repositories from project.deps
      id: clone-repositories
      shell: bash
      run: |
        exit_code=0
        pids=()
        cloned_repos=()

        while IFS= read -r repo || [[ -n $repo ]]; do
          echo "Cloning repository: $repo"
          {
            default_branch=$(git ls-remote --symref "https://${{ inputs.token }}@github.com/dbeaver/$repo.git" HEAD 2>/dev/null | grep '^ref:' | awk '{print $2}' | sed 's|refs/heads/||')

            git clone --depth 0 -b "${{ env.GITHUB_HEAD_REF }}" "https://${{ inputs.token }}@github.com/dbeaver/$repo.git" "$repo" 2>/dev/null || \
            git clone --depth 0 -b "${{ env.GITHUB_BASE_REF }}" "https://${{ inputs.token }}@github.com/dbeaver/$repo.git" "$repo" 2>/dev/null || \
            git clone --depth 0 -b "$default_branch" "https://${{ inputs.token }}@github.com/dbeaver/$repo.git" "$repo"
            if [[ $? -ne 0 ]]; then
              exit 1
            fi
            
            cd $repo
            git restore-mtime
            cd ..
          } &

          pids+=($!)
        done < "${{ inputs.project_deps_path }}"

        wait "${pids[@]}"

        # Collect successfully cloned repos
        while IFS= read -r repo || [[ -n $repo ]]; do
          [[ -d "$repo" ]] && cloned_repos+=("$repo")
        done < "${{ inputs.project_deps_path }}"

        echo "Cloned repositories:"
        printf "%s\n" "${cloned_repos[@]}"

        # Ensure correct JSON output format
        if [[ ${#cloned_repos[@]} -eq 0 ]]; then
          folders_json="[]"
        else
          folders_json=$(printf '%s\n' "${cloned_repos[@]}" | jq -R . | jq -s .)
        fi

        # Properly set multi-line output
        echo "folders<<EOF" >> "$GITHUB_OUTPUT"
        echo "$folders_json" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        exit $exit_code
